name: Veilward Slice Regression

on:
  push:
    branches: [main, 'phase9-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: npm run check
      - name: Verify world travel, combat and quest save flow
        run: npm test
